name: Vane extension

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vane-native:
    # The called workflow verifies its exact SHA from GitHub job metadata.
    uses: AstroVela/vane-extension-ci-tools/.github/workflows/_vane_extension_ci.yml@b3229fa44b261890e4555d8b595f1b5863562366
    with:
      ci_tools_version: b3229fa44b261890e4555d8b595f1b5863562366
      manifest: vane-extension.toml
      build_jobs: 12
      run_native_tests: true
