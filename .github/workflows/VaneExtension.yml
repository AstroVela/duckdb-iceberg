name: Vane extension

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Build only, publish a development candidate, or stage and promote a production release
        type: choice
        options:
          - build-only
          - testpypi-dev
          - release
        default: build-only
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ inputs.operation || 'ci' }}
  cancel-in-progress: ${{ inputs.operation != 'testpypi-dev' && inputs.operation != 'release' }}

permissions:
  contents: read

env:
  VANE_RELEASE_MANIFEST: ${{ inputs.operation == 'release' && 'vane-extension-release.toml' || 'vane-extension.toml' }}
  VANE_RELEASE_CHANNEL: ${{ inputs.operation == 'release' && 'release' || 'testpypi-dev' }}
  VANE_RUNTIME_INDEX_URL: ${{ inputs.operation == 'release' && 'https://pypi.org/simple/' || 'https://test.pypi.org/simple/' }}
  PIP_CONFIG_FILE: /dev/null
  PIP_EXTRA_INDEX_URL: ""
  PIP_FIND_LINKS: ""
  PIP_NO_INDEX: ""

jobs:
  release-preflight:
    if: inputs.operation == 'testpypi-dev' || inputs.operation == 'release'
    name: Check protected publication context and exact Vane version
    runs-on: ubuntu-24.04
    outputs:
      vane_version: ${{ steps.candidate.outputs.vane_version }}
    steps:
      - name: Require the repository and protected default branch
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = AstroVela/duckdb-iceberg
          test "$GITHUB_REF" = refs/heads/v1.5-variegata_vane
          test "$GITHUB_REF_PROTECTED" = true

      - name: Checkout release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Initialize exact shared release tooling
        run: git submodule update --init vane-extension-ci-tools

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install read-only version and release tooling
        run: |
          python -m pip install --disable-pip-version-check \
            'setuptools-scm>=9.2.0' -r vane-extension-ci-tools/requirements-release.txt

      - name: Read selected exact Vane pin
        id: manifest
        run: |
          python -I vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_RELEASE_MANIFEST" --extension-root . \
            manifest --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane with complete version history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          fetch-depth: 0
          persist-credentials: false

      - name: Reject an unreleased production runtime before signing approval
        id: candidate
        run: |
          python -I scripts/vane_release_preflight.py \
            --channel "$VANE_RELEASE_CHANNEL" \
            --manifest "$VANE_RELEASE_MANIFEST" --vane-source vane \
            --ci-tools-version "$(git rev-parse HEAD:vane-extension-ci-tools)" \
            --github-output "$GITHUB_OUTPUT"

  vane-native:
    if: inputs.operation != 'testpypi-dev' && inputs.operation != 'release'
    # The called workflow verifies its exact SHA from GitHub job metadata.
    uses: AstroVela/vane-extension-ci-tools/.github/workflows/_vane_extension_ci.yml@693473fcb7603e053f40f37d6115a1f86b53f4ec
    with:
      ci_tools_version: 693473fcb7603e053f40f37d6115a1f86b53f4ec
      manifest: vane-extension.toml
      build_jobs: 12
      run_native_tests: true

  vane-provider-release-tooling:
    if: inputs.operation != 'testpypi-dev' && inputs.operation != 'release'
    name: Validate Avro and Iceberg provider release tooling
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize exact shared release tooling
        run: git submodule update --init vane-extension-ci-tools

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install release validation tooling
        run: python -m pip install --disable-pip-version-check -r vane-extension-ci-tools/requirements-release.txt 'PyYAML>=6.0.2'

      - name: Exercise the configured provider graph and index verification
        run: |
          python -I test/vane/test_vane_provider_release.py
          python -I test/vane/test_vane_production_release.py

  vane-dynamic-wheels:
    if: inputs.operation != 'testpypi-dev' && inputs.operation != 'release'
    name: Build signed Vane dynamic Iceberg wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      VANE_EXTENSION_ROOT: ${{ github.workspace }}/extension
      VANE_MANIFEST: ${{ github.workspace }}/extension/vane-extension.toml
      VANE_SOURCE_DIR: ${{ github.workspace }}/vane
      VANE_DYNAMIC_BUILD_DIR: ${{ github.workspace }}/build/vane-dynamic-wheel
      VANE_DYNAMIC_DIST_DIR: ${{ github.workspace }}/build/vane-dynamic-wheel-dist
      VANE_VCPKG_ROOT: ${{ github.workspace }}/vane-vcpkg
      VANE_VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vane/vcpkg_installed
      VANE_BUILD_JOBS: 12
      VANE_CMAKE_COMPILER_LAUNCHER: ccache
      VCPKG_TARGET_TRIPLET: x64-linux
      CCACHE_DIR: ${{ github.workspace }}/.cache/vane-dynamic-wheel-ccache
      CCACHE_MAXSIZE: 750M
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Checkout extension and submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: extension
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Checkout exact Avro dependency
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: duckdb/duckdb-avro
          ref: 7f423d69709045e38f8431b3470e0395fce1a595
          path: avro
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Read integration manifest
        id: manifest
        run: |
          python extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            manifest \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact Vane and CI-tools identities
        shell: bash
        env:
          VANE_CI_TOOLS_VERSION: 693473fcb7603e053f40f37d6115a1f86b53f4ec
        run: |
          set -euo pipefail
          actual_ci_tools="$(git -C extension/vane-extension-ci-tools rev-parse HEAD)"
          test "$actual_ci_tools" = "$VANE_CI_TOOLS_VERSION"
          python extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            verify-ci-tools \
            --ci-tools-source extension/vane-extension-ci-tools \
            --expected-sha "$VANE_CI_TOOLS_VERSION"
          python extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            identity \
            --vane-source "$VANE_SOURCE_DIR"

      - name: Install native and wheel tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            libtool \
            ninja-build \
            openssl \
            pkg-config \
            tar \
            unzip \
            zip
          python -m pip install \
            "auditwheel>=6.4" \
            build \
            "cmake>=3.29" \
            "ninja>=1.10" \
            -r extension/vane-extension-ci-tools/requirements-release.txt \
            "patchelf>=0.17.2" \
            "pybind11[global]>=3.0.0" \
            "scikit-build-core>=0.11.4" \
            "setuptools-scm>=9.2.0"

      - name: Restore dynamic-wheel compiler cache
        id: dynamic_wheel_ccache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: vane-dynamic-wheel-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.manifest.outputs.vane_revision }}-${{ steps.manifest.outputs.vcpkg_revision }}-${{ hashFiles('extension/vcpkg.json') }}

      - name: Reset dynamic-wheel compiler cache statistics
        run: ccache --zero-stats

      - name: Set up extension vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ steps.manifest.outputs.vcpkg_revision }}
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      - name: Remove verified run-vcpkg state marker
        shell: bash
        env:
          VANE_EXTENSION_VCPKG_REVISION: ${{ steps.manifest.outputs.vcpkg_revision }}
          VANE_EXTENSION_VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euo pipefail
          marker="$VANE_EXTENSION_VCPKG_ROOT/vcpkgLastBuiltCommitId"
          test -f "$marker"
          test ! -L "$marker"
          test "$(wc -c < "$marker")" -eq 40
          test "$(<"$marker")" = "$VANE_EXTENSION_VCPKG_REVISION"
          rm -- "$marker"
          vcpkg_status="$(git -C "$VANE_EXTENSION_VCPKG_ROOT" status --porcelain --untracked-files=all)"
          test -z "$vcpkg_status"

      - name: Bootstrap exact Vane dependencies
        env:
          VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
        run: |
          make -f extension/vane-extension-ci-tools/makefiles/vane_extension.Makefile \
            vane_wheel_dependencies \
            VANE_EXTENSION_ROOT="$VANE_EXTENSION_ROOT" \
            VANE_MANIFEST="$VANE_MANIFEST" \
            VANE_SOURCE_DIR="$VANE_SOURCE_DIR" \
            VANE_VCPKG_ROOT="$VANE_VCPKG_ROOT" \
            VANE_VCPKG_INSTALLED_DIR="$VANE_VCPKG_INSTALLED_DIR" \
            VANE_BUILD_JOBS="$VANE_BUILD_JOBS"

      - name: Build and verify dynamic provider wheels
        env:
          VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          VCPKG_MAX_CONCURRENCY: ${{ env.VANE_BUILD_JOBS }}
        run: |
          python -I extension/scripts/build_vane_dynamic_wheels.py \
            --extension-root "$VANE_EXTENSION_ROOT" \
            --avro-source "${{ github.workspace }}/avro" \
            --vane-source "$VANE_SOURCE_DIR" \
            --vane-revision "${{ steps.manifest.outputs.vane_revision }}" \
            --vane-vcpkg-installed "$VANE_VCPKG_INSTALLED_DIR" \
            --vcpkg-toolchain "$VCPKG_TOOLCHAIN_PATH" \
            --build-directory "$VANE_DYNAMIC_BUILD_DIR" \
            --output-directory "$VANE_DYNAMIC_DIST_DIR" \
            --jobs "$VANE_BUILD_JOBS" \
            --phase full \
            --signing-profile ci-test \
            --signing-private-key "$VANE_SOURCE_DIR/external/duckdb/test/mbedtls/private.pem" \
            --package-local-runtime

      - name: Report dynamic-wheel compiler cache
        if: always()
        shell: bash
        env:
          VANE_CCACHE_ACTION_HIT: ${{ steps.dynamic_wheel_ccache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          printf 'GitHub Actions ccache restore hit: %s\n' "${VANE_CCACHE_ACTION_HIT:-false}"
          ccache --show-stats

      - name: Upload CI-only dynamic wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vane-iceberg-dynamic-wheels
          path: ${{ env.VANE_DYNAMIC_DIST_DIR }}/*.whl
          if-no-files-found: error
          retention-days: 1

  vane-wheel-iceberg-integration:
    if: inputs.operation != 'testpypi-dev' && inputs.operation != 'release'
    name: Vane dynamic wheel local Iceberg integration
    needs: vane-dynamic-wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VANE_RUNNER: local-fast
      VANE_EXPECTED_EXTENSION_TRUST_IDENTITY: vane-ci-test-key

    steps:
      - name: Checkout extension
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download verified dynamic wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: vane-iceberg-dynamic-wheels
          path: vane-wheels

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Start local Iceberg fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/generated/iceberg/spark-rest data/generated/intermediates
          docker compose -f scripts/docker-compose.yml down -v
          docker compose -f scripts/docker-compose.yml up -d

      - name: Wait for fixture initialization
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if docker compose -f scripts/docker-compose.yml logs mc 2>&1 | grep -Fq \
              'MinIO warehouse and default namespace initialized.'; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f scripts/docker-compose.yml logs
          exit 1

      - name: Exercise Iceberg through the packaged provider wheels
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-vane-wheel-integration
          . .venv-vane-wheel-integration/bin/activate
          mapfile -t base_wheels < <(find vane-wheels -maxdepth 1 -type f -name 'vane_ai-*.whl' -print | sort)
          mapfile -t avro_wheels < <(find vane-wheels -maxdepth 1 -type f -name 'vane_extension_avro-*.whl' -print | sort)
          mapfile -t iceberg_wheels < <(find vane-wheels -maxdepth 1 -type f -name 'vane_extension_iceberg-*.whl' -print | sort)
          test "${#base_wheels[@]}" -eq 1
          test "${#avro_wheels[@]}" -eq 1
          test "${#iceberg_wheels[@]}" -eq 1
          python -m pip install --disable-pip-version-check \
            "${base_wheels[0]}" "${avro_wheels[0]}" "${iceberg_wheels[0]}"
          python -I test/vane/test_vane_wheel_iceberg.py

      - name: Stop local Iceberg fixture
        if: always()
        run: docker compose -f scripts/docker-compose.yml down -v

  vane-provider-prepare:
    if: inputs.operation == 'testpypi-dev' || inputs.operation == 'release'
    needs: release-preflight
    name: Build unsigned provider artifacts without signing credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:012f4a50472412f18bb2b450c1cce7158434cfae4ae878591c2748a13a30c2be
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.unsigned_artifact.outputs.artifact-id }}
      vane_version: ${{ needs.release-preflight.outputs.vane_version }}
    env:
      VANE_EXTENSION_ROOT: ${{ github.workspace }}/extension
      VANE_MANIFEST: ${{ github.workspace }}/extension/${{ inputs.operation == 'release' && 'vane-extension-release.toml' || 'vane-extension.toml' }}
      VANE_SOURCE_DIR: ${{ github.workspace }}/vane
      VANE_DYNAMIC_BUILD_DIR: ${{ github.workspace }}/build/vane-testpypi-wheel
      VANE_DYNAMIC_DIST_DIR: ${{ github.workspace }}/build/vane-testpypi-wheel-dist
      VANE_RUNTIME_WHEEL_DIR: ${{ github.workspace }}/build/vane-testpypi-runtime-wheels
      VANE_VCPKG_ROOT: ${{ github.workspace }}/vane-vcpkg
      VANE_VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vane/vcpkg_installed
      VANE_PYTHON: /opt/python/cp312-cp312/bin/python
      VANE_BUILD_JOBS: 16
      VANE_CMAKE_COMPILER_LAUNCHER: ccache
      VCPKG_TARGET_TRIPLET: x64-linux
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg-archives
      CCACHE_DIR: ${{ github.workspace }}/.cache/vane-testpypi-wheel-ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Require the protected release branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/v1.5-variegata_vane

      - name: Checkout extension and submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: extension
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Checkout exact Avro dependency
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: duckdb/duckdb-avro
          ref: 7f423d69709045e38f8431b3470e0395fce1a595
          path: avro
          fetch-depth: 1
          persist-credentials: false

      - name: Read integration manifest
        id: manifest
        shell: bash
        run: |
          "$VANE_PYTHON" extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            manifest \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          fetch-depth: 0
          persist-credentials: false

      - name: Download every exact indexed Vane runtime wheel
        id: vane_candidate
        shell: bash
        env:
          INDEX_URL: ${{ env.VANE_RUNTIME_INDEX_URL }}
          VANE_VERSION: ${{ needs.release-preflight.outputs.vane_version }}
        run: |
          set -euo pipefail
          version="$VANE_VERSION"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p "$VANE_RUNTIME_WHEEL_DIR"
          for runtime in cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314; do
            interpreter="/opt/python/$runtime/bin/python"
            destination="$VANE_RUNTIME_WHEEL_DIR/$runtime"
            mkdir -p "$destination"
            "$interpreter" -m pip download \
              --disable-pip-version-check \
              --no-cache-dir \
              --no-deps \
              --only-binary=:all: \
              --index-url "$INDEX_URL" \
              --dest "$destination" \
              "vane-ai==$version"
            test "$(find "$destination" -maxdepth 1 -type f -name 'vane_ai-*.whl' | wc -l)" -eq 1
          done

      - name: Install manylinux build tooling
        shell: bash
        run: |
          set -euo pipefail
          yum install -y \
            autoconf \
            automake \
            bison \
            ccache \
            curl \
            flex \
            git \
            libtool \
            make \
            openssl \
            perl \
            pkgconfig \
            tar \
            unzip \
            which \
            zip
          "$VANE_PYTHON" -m pip install \
            "auditwheel>=6.4" \
            build \
            "cmake>=3.29" \
            "ninja>=1.10" \
            -r extension/vane-extension-ci-tools/requirements-release.txt \
            "patchelf>=0.17.2" \
            "pybind11[global]>=3.0.0" \
            "scikit-build-core>=0.11.4" \
            "setuptools-scm>=9.2.0"
          bash "$VANE_SOURCE_DIR/scripts/bootstrap_manylinux_bison.sh"
          echo "$(dirname "$VANE_PYTHON")" >> "$GITHUB_PATH"

      - name: Validate exact Vane and CI-tools identities
        shell: bash
        env:
          VANE_CI_TOOLS_VERSION: 693473fcb7603e053f40f37d6115a1f86b53f4ec
        run: |
          set -euo pipefail
          actual_ci_tools="$(git -C extension/vane-extension-ci-tools rev-parse HEAD)"
          test "$actual_ci_tools" = "$VANE_CI_TOOLS_VERSION"
          "$VANE_PYTHON" extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            verify-ci-tools \
            --ci-tools-source extension/vane-extension-ci-tools \
            --expected-sha "$VANE_CI_TOOLS_VERSION"
          "$VANE_PYTHON" extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            identity \
            --vane-source "$VANE_SOURCE_DIR"

      - name: Restore compiler and package caches
        id: testpypi_cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vane-testpypi-wheel-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.manifest.outputs.vane_revision }}-${{ steps.manifest.outputs.vcpkg_revision }}-${{ hashFiles('extension/vcpkg.json') }}

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Set up extension vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ steps.manifest.outputs.vcpkg_revision }}
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      - name: Remove verified run-vcpkg state marker
        shell: bash
        env:
          VANE_EXTENSION_VCPKG_REVISION: ${{ steps.manifest.outputs.vcpkg_revision }}
          VANE_EXTENSION_VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euo pipefail
          marker="$VANE_EXTENSION_VCPKG_ROOT/vcpkgLastBuiltCommitId"
          test -f "$marker"
          test ! -L "$marker"
          test "$(wc -c < "$marker")" -eq 40
          test "$(<"$marker")" = "$VANE_EXTENSION_VCPKG_REVISION"
          rm -- "$marker"
          vcpkg_status="$(git -C "$VANE_EXTENSION_VCPKG_ROOT" status --porcelain --untracked-files=all)"
          test -z "$vcpkg_status"

      - name: Bootstrap exact Vane dependencies
        env:
          VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          VANE_BOOTSTRAP_PYTHON: ${{ env.VANE_PYTHON }}
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          make -f extension/vane-extension-ci-tools/makefiles/vane_extension.Makefile \
            vane_wheel_dependencies \
            VANE_EXTENSION_ROOT="$VANE_EXTENSION_ROOT" \
            VANE_MANIFEST="$VANE_MANIFEST" \
            VANE_SOURCE_DIR="$VANE_SOURCE_DIR" \
            VANE_VCPKG_ROOT="$VANE_VCPKG_ROOT" \
            VANE_VCPKG_INSTALLED_DIR="$VANE_VCPKG_INSTALLED_DIR" \
            VANE_BUILD_JOBS="$VANE_BUILD_JOBS" \
            VANE_PYTHON="$VANE_PYTHON"

      - name: Prepare unsigned native artifacts and licenses
        shell: bash
        env:
          VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          VCPKG_MAX_CONCURRENCY: ${{ env.VANE_BUILD_JOBS }}
        run: |
          set -euo pipefail
          if [ "$VANE_RELEASE_CHANNEL" = release ]; then
            signing_profile=production
          else
            signing_profile=testpypi
          fi
          runtime_arguments=()
          for runtime in cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314; do
            interpreter="/opt/python/$runtime/bin/python"
            mapfile -t wheels < <(find "$VANE_RUNTIME_WHEEL_DIR/$runtime" -maxdepth 1 -type f -name 'vane_ai-*.whl' -print)
            test "${#wheels[@]}" -eq 1
            runtime_arguments+=(--runtime-python "$interpreter" --runtime-wheel "${wheels[0]}")
          done

          "$VANE_PYTHON" -I extension/scripts/build_vane_dynamic_wheels.py \
            --extension-root "$VANE_EXTENSION_ROOT" \
            --avro-source "$GITHUB_WORKSPACE/avro" \
            --vane-source "$VANE_SOURCE_DIR" \
            --vane-revision "${{ steps.manifest.outputs.vane_revision }}" \
            --vane-vcpkg-installed "$VANE_VCPKG_INSTALLED_DIR" \
            --vcpkg-toolchain "$VCPKG_TOOLCHAIN_PATH" \
            --build-directory "$VANE_DYNAMIC_BUILD_DIR" \
            --output-directory "$VANE_DYNAMIC_DIST_DIR" \
            --jobs "$VANE_BUILD_JOBS" \
            --signing-profile "$signing_profile" \
            --phase prepare \
            "${runtime_arguments[@]}"

      - name: Report compiler cache
        if: always()
        shell: bash
        env:
          VANE_CACHE_ACTION_HIT: ${{ steps.testpypi_cache.outputs.cache-hit }}
        run: |
          printf 'GitHub Actions cache restore hit: %s\n' "${VANE_CACHE_ACTION_HIT:-false}"
          ccache --show-stats

      - name: Upload unsigned native artifacts and licenses
        id: unsigned_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vane-unsigned-provider-artifacts
          path: ${{ env.VANE_DYNAMIC_DIST_DIR }}/
          if-no-files-found: error
          retention-days: 30

  vane-provider-sign:
    name: Sign native provider data in an isolated job
    needs: vane-provider-prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment:
      name: ${{ inputs.operation == 'release' && 'production-signing' || 'testpypi' }}
    outputs:
      artifact_id: ${{ steps.signed_artifact.outputs.artifact-id }}
    env:
      VANE_SIGNING_PROFILE: ${{ inputs.operation == 'release' && 'production' || 'testpypi' }}
    steps:
      - name: Checkout only the reviewed signing wrapper
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Read committed source pin without installing dependencies
        id: manifest
        run: |
          /usr/bin/python3 -I -S scripts/sign_vane_release.py \
            --manifest "$VANE_RELEASE_MANIFEST" manifest --github-output "$GITHUB_OUTPUT"

      - name: Checkout the exact reviewed stdlib signing utility
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: AstroVela/vane
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          persist-credentials: false

      - name: Download original unsigned data by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.vane-provider-prepare.outputs.artifact_id }}
          merge-multiple: true
          digest-mismatch: error
          path: incoming

      - name: Fingerprint-check and sign data without importing build tooling
        env:
          VANE_SIGNING_PRIVATE_KEY: ${{ secrets[inputs.operation == 'release' && 'VANE_EXTENSION_SIGNING_PRIVATE_KEY' || 'VANE_TESTPYPI_EXTENSION_SIGNING_PRIVATE_KEY'] }}
        run: |
          /usr/bin/python3 -I -S scripts/sign_vane_release.py \
            --manifest "$VANE_RELEASE_MANIFEST" sign --vane-source "$GITHUB_WORKSPACE/vane" \
            --profile "$VANE_SIGNING_PROFILE" \
            --input-directory "$GITHUB_WORKSPACE/incoming/artifacts" \
            --output-directory "$GITHUB_WORKSPACE/signed"

      - name: Upload only the signed native files
        id: signed_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vane-signed-provider-artifacts
          path: signed/*.duckdb_extension
          if-no-files-found: error
          retention-days: 30

  vane-testpypi-wheels:
    name: Package and verify signed provider wheels without credentials
    needs: [vane-provider-prepare, vane-provider-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:012f4a50472412f18bb2b450c1cce7158434cfae4ae878591c2748a13a30c2be
    permissions:
      contents: read
    outputs:
      vane_version: ${{ steps.release.outputs.vane_version }}
      avro_version: ${{ steps.release.outputs.avro_version }}
      iceberg_version: ${{ steps.release.outputs.iceberg_version }}
      artifact_id: ${{ steps.wheels.outputs.artifact-id }}
    env:
      VANE_EXTENSION_ROOT: ${{ github.workspace }}/extension
      VANE_MANIFEST: ${{ github.workspace }}/extension/${{ inputs.operation == 'release' && 'vane-extension-release.toml' || 'vane-extension.toml' }}
      VANE_SOURCE_DIR: ${{ github.workspace }}/vane
      VANE_PYTHON: /opt/python/cp312-cp312/bin/python
      VANE_RUNTIME_WHEEL_DIR: ${{ github.workspace }}/runtime-wheels
      VANE_DYNAMIC_DIST_DIR: ${{ github.workspace }}/dist
      VANE_SIGNING_PROFILE: ${{ inputs.operation == 'release' && 'production' || 'testpypi' }}
    steps:
      - name: Checkout packaging code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: extension
          persist-credentials: false

      - name: Initialize exact shared packaging validation
        shell: bash
        run: git -C extension submodule update --init vane-extension-ci-tools

      - name: Install unprivileged packaging tooling
        shell: bash
        run: |
          "$VANE_PYTHON" -m pip install -r extension/vane-extension-ci-tools/requirements-release.txt
      - name: Read integration manifest
        id: manifest
        shell: bash
        run: |
          "$VANE_PYTHON" extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            manifest \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          fetch-depth: 0
          persist-credentials: false

      - name: Download every exact indexed Vane runtime wheel
        id: vane_candidate
        shell: bash
        env:
          INDEX_URL: ${{ env.VANE_RUNTIME_INDEX_URL }}
          VANE_VERSION: ${{ needs.vane-provider-prepare.outputs.vane_version }}
        run: |
          set -euo pipefail
          version="$VANE_VERSION"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p "$VANE_RUNTIME_WHEEL_DIR"
          for runtime in cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314; do
            interpreter="/opt/python/$runtime/bin/python"
            destination="$VANE_RUNTIME_WHEEL_DIR/$runtime"
            mkdir -p "$destination"
            "$interpreter" -m pip download \
              --disable-pip-version-check \
              --no-cache-dir \
              --no-deps \
              --only-binary=:all: \
              --index-url "$INDEX_URL" \
              --dest "$destination" \
              "vane-ai==$version"
            test "$(find "$destination" -maxdepth 1 -type f -name 'vane_ai-*.whl' | wc -l)" -eq 1
          done

      - name: Download original unsigned license bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.vane-provider-prepare.outputs.artifact_id }}
          merge-multiple: true
          digest-mismatch: error
          path: unsigned
      - name: Download original signed native data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.vane-provider-sign.outputs.artifact_id }}
          merge-multiple: true
          digest-mismatch: error
          path: signed
      - name: Package and qualify the full provider matrix
        shell: bash
        run: |
          set -euo pipefail
          runtime_arguments=()
          for runtime in cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314; do
            interpreter="/opt/python/$runtime/bin/python"
            mapfile -t wheels < <(find "$VANE_RUNTIME_WHEEL_DIR/$runtime" -maxdepth 1 -type f -name 'vane_ai-*.whl' -print)
            test "${#wheels[@]}" -eq 1
            runtime_arguments+=(--runtime-python "$interpreter" --runtime-wheel "${wheels[0]}")
          done
          "$VANE_PYTHON" -I extension/scripts/package_vane_dynamic_wheels.py \
            --vane-source "$VANE_SOURCE_DIR" \
            --vane-revision "${{ steps.manifest.outputs.vane_revision }}" \
            --unsigned-directory "$GITHUB_WORKSPACE/unsigned" \
            --signed-directory "$GITHUB_WORKSPACE/signed" \
            --output-directory "$VANE_DYNAMIC_DIST_DIR" \
            --signing-profile "$VANE_SIGNING_PROFILE" \
            "${runtime_arguments[@]}"
      - name: Validate the immutable publishable release set
        id: release
        shell: bash
        run: |
          publish_checks=(--require-publishable-on testpypi)
          if [ "$VANE_RELEASE_CHANNEL" = release ]; then
            publish_checks+=(--require-publishable-on pypi)
          fi
          "$VANE_PYTHON" -I extension/vane-extension-ci-tools/scripts/vane_provider_release.py validate \
            --manifest "$VANE_MANIFEST" --extension-root "$VANE_EXTENSION_ROOT" \
            --vane-source "$VANE_SOURCE_DIR" \
            --ci-tools-version "$(git -C "$VANE_EXTENSION_ROOT" rev-parse HEAD:vane-extension-ci-tools)" \
            --config extension/vane-provider-release.toml \
            --directory "$VANE_DYNAMIC_DIST_DIR" \
            --vane-version "${{ steps.vane_candidate.outputs.version }}" \
            --channel "$VANE_RELEASE_CHANNEL" \
            "${publish_checks[@]}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload verified provider wheels
        id: wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vane-testpypi-provider-wheels
          path: ${{ env.VANE_DYNAMIC_DIST_DIR }}/*.whl
          if-no-files-found: error
          retention-days: 30

  assemble-testpypi-providers:
    name: Validate, attest and sign TestPyPI providers
    needs: vane-testpypi-wheels
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      vane_version: ${{ needs.vane-testpypi-wheels.outputs.vane_version }}
      avro_version: ${{ needs.vane-testpypi-wheels.outputs.avro_version }}
      iceberg_version: ${{ needs.vane-testpypi-wheels.outputs.iceberg_version }}
      candidate_artifact_id: ${{ needs.vane-testpypi-wheels.outputs.artifact_id }}
      avro_artifact_id: ${{ steps.avro_artifact.outputs.artifact-id }}
      iceberg_artifact_id: ${{ steps.iceberg_artifact.outputs.artifact-id }}

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize exact shared release tooling
        run: git submodule update --init vane-extension-ci-tools

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install release validation tooling
        run: python -m pip install --disable-pip-version-check -r vane-extension-ci-tools/requirements-release.txt

      - name: Read exact Vane source pin
        id: manifest
        run: |
          python -I vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_RELEASE_MANIFEST" --extension-root . \
            manifest --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane source for release verification
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          fetch-depth: 1
          persist-credentials: false

      - name: Download provider wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.vane-testpypi-wheels.outputs.artifact_id }}
          merge-multiple: true
          path: packages

      - name: Revalidate the complete release set
        run: |
          publish_checks=(--require-publishable-on testpypi)
          if [ "$VANE_RELEASE_CHANNEL" = release ]; then
            publish_checks+=(--require-publishable-on pypi)
          fi
          python -I vane-extension-ci-tools/scripts/vane_provider_release.py validate \
            --manifest "$VANE_RELEASE_MANIFEST" --extension-root . \
            --vane-source vane \
            --ci-tools-version "$(git rev-parse HEAD:vane-extension-ci-tools)" \
            --config vane-provider-release.toml \
            --directory packages \
            --vane-version "${{ needs.vane-testpypi-wheels.outputs.vane_version }}" \
            --channel "$VANE_RELEASE_CHANNEL" \
            "${publish_checks[@]}"

      - name: Separate distributions and generate checksums
        run: |
          mkdir -p distributions/avro distributions/iceberg release-assets
          cp packages/vane_extension_avro-*.whl distributions/avro/
          cp packages/vane_extension_iceberg-*.whl distributions/iceberg/
          (cd packages && sha256sum *.whl) > release-assets/SHA256SUMS

      - name: Generate a CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: packages
          format: cyclonedx-json
          output-file: release-assets/vane-extension-providers-sbom.cdx.json
          upload-artifact: false

      - name: Attest provider provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/packages/*

      - name: Preserve the provenance bundle
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            release-assets/vane-extension-providers-build-provenance.sigstore.json

      - name: Sign provider distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@f7ad0af51a5648d09a20d00370f0a91c3bdf8f84 # v3.0.1
        with:
          inputs: packages/*.whl

      - name: Upload Avro distributions
        id: avro_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vane-testpypi-avro-distributions
          path: distributions/avro/*.whl
          if-no-files-found: error
          retention-days: 30

      - name: Upload Iceberg distributions
        id: iceberg_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vane-testpypi-iceberg-distributions
          path: distributions/iceberg/*.whl
          if-no-files-found: error
          retention-days: 30

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vane-testpypi-provider-supplemental
          path: |
            release-assets/*
            packages/*.sigstore.json
          if-no-files-found: error
          retention-days: 30

  publish-testpypi-avro:
    name: Publish Avro provider to TestPyPI
    needs: assemble-testpypi-providers
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/vane-extension-avro
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Avro distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.assemble-testpypi-providers.outputs.avro_artifact_id }}
          merge-multiple: true
          path: dist

      - name: Publish through trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-testpypi-avro:
    name: Verify indexed Avro provider
    needs: [assemble-testpypi-providers, publish-testpypi-avro]
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize exact shared release tooling
        run: git submodule update --init vane-extension-ci-tools

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install release validation tooling
        run: python -m pip install --disable-pip-version-check -r vane-extension-ci-tools/requirements-release.txt

      - name: Read exact Vane source pin
        id: manifest
        run: |
          python -I vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_RELEASE_MANIFEST" --extension-root . \
            manifest --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane source for release verification
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          fetch-depth: 1
          persist-credentials: false

      - name: Download Avro distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.assemble-testpypi-providers.outputs.avro_artifact_id }}
          merge-multiple: true
          path: dist

      - name: Compare the immutable indexed release
        run: |
          python -I vane-extension-ci-tools/scripts/vane_provider_release.py verify-index \
            --index testpypi \
            --manifest "$VANE_RELEASE_MANIFEST" --extension-root . \
            --vane-source vane \
            --ci-tools-version "$(git rev-parse HEAD:vane-extension-ci-tools)" \
            --config vane-provider-release.toml \
            --directory dist \
            --provider avro \
            --version "${{ needs.assemble-testpypi-providers.outputs.avro_version }}"

  publish-testpypi-iceberg:
    name: Publish Iceberg provider to TestPyPI
    needs: [assemble-testpypi-providers, verify-testpypi-avro]
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/vane-extension-iceberg
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Iceberg distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.assemble-testpypi-providers.outputs.iceberg_artifact_id }}
          merge-multiple: true
          path: dist

      - name: Publish through trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-testpypi-iceberg:
    name: Verify indexed Iceberg provider
    needs: [assemble-testpypi-providers, publish-testpypi-iceberg]
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize exact shared release tooling
        run: git submodule update --init vane-extension-ci-tools

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install release validation tooling
        run: python -m pip install --disable-pip-version-check -r vane-extension-ci-tools/requirements-release.txt

      - name: Read exact Vane source pin
        id: manifest
        run: |
          python -I vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_RELEASE_MANIFEST" --extension-root . \
            manifest --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane source for release verification
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          fetch-depth: 1
          persist-credentials: false

      - name: Download Iceberg distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.assemble-testpypi-providers.outputs.iceberg_artifact_id }}
          merge-multiple: true
          path: dist

      - name: Compare the immutable indexed release
        run: |
          python -I vane-extension-ci-tools/scripts/vane_provider_release.py verify-index \
            --index testpypi \
            --manifest "$VANE_RELEASE_MANIFEST" --extension-root . \
            --vane-source vane \
            --ci-tools-version "$(git rev-parse HEAD:vane-extension-ci-tools)" \
            --config vane-provider-release.toml \
            --directory dist \
            --provider iceberg \
