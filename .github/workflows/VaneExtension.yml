    name: Verify immutable Avro promotion after approval
    needs: [assemble-testpypi-providers, testpypi-local-iceberg-integration, testpypi-ray-iceberg-integration]
    runs-on: ubuntu-24.04
    environment:
      name: pypi-avro
      url: https://pypi.org/p/vane-extension-avro
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Initialize exact shared release tooling
        run: git submodule update --init vane-extension-ci-tools

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install shared promotion validator
        run: python -m pip install --disable-pip-version-check -r vane-extension-ci-tools/requirements-release.txt

      - name: Read exact production Vane source pin
        id: manifest
        run: |
          python -I vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest vane-extension-release.toml --extension-root . \
            manifest --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact production Vane source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          persist-credentials: false

      - name: Download the complete qualified candidate graph
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.assemble-testpypi-providers.outputs.candidate_artifact_id }}
          merge-multiple: true
          path: packages

      - name: Recheck immutable promotion after environment approval
        run: |
          python -I vane-extension-ci-tools/scripts/vane_provider_release.py verify-promotion \
            --manifest vane-extension-release.toml --extension-root . \
            --vane-source vane \
            --ci-tools-version "$(git rev-parse HEAD:vane-extension-ci-tools)" \
            --config vane-provider-release.toml --directory packages \
            --vane-version "${{ needs.assemble-testpypi-providers.outputs.vane_version }}"

