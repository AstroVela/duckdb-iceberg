          mapfile -t base_wheels < <(find vane-wheels -maxdepth 1 -type f -name 'vane_ai-*.whl' -print | sort)
          mapfile -t avro_wheels < <(find vane-wheels -maxdepth 1 -type f -name 'vane_extension_avro-*.whl' -print | sort)
          mapfile -t iceberg_wheels < <(find vane-wheels -maxdepth 1 -type f -name 'vane_extension_iceberg-*.whl' -print | sort)
          test "${#base_wheels[@]}" -eq 1
          test "${#avro_wheels[@]}" -eq 1
          test "${#iceberg_wheels[@]}" -eq 1
          python -m pip install --disable-pip-version-check \
            "${base_wheels[0]}" "${avro_wheels[0]}" "${iceberg_wheels[0]}"
          python -I test/vane/test_vane_wheel_ray_iceberg.py

      - name: Stop local Iceberg fixture
        if: always()
        run: docker compose -f scripts/docker-compose.yml down -v
