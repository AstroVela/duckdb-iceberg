  testpypi-local-iceberg-integration:
    name: TestPyPI local Iceberg integration
    needs: [assemble-testpypi-providers, verify-testpypi-iceberg]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VANE_RUNNER: local-fast
      VANE_EXPECTED_EXTENSION_TRUST_IDENTITY: astrovela/vane-testpypi-v1
      INDEX_URL: https://test.pypi.org/simple/

    steps:
      - name: Checkout extension tests
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download expected Avro distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: vane-testpypi-avro-distributions
          path: expected/avro

      - name: Download expected Iceberg distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: vane-testpypi-iceberg-distributions
          path: expected/iceberg

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install the exact indexed package graph
        shell: bash
        env:
          VANE_VERSION: ${{ needs.assemble-testpypi-providers.outputs.vane_version }}
          AVRO_VERSION: ${{ needs.assemble-testpypi-providers.outputs.avro_version }}
          ICEBERG_VERSION: ${{ needs.assemble-testpypi-providers.outputs.iceberg_version }}
        run: |
          set -euo pipefail
          python -m venv .venv-vane-testpypi-local
          . .venv-vane-testpypi-local/bin/activate
          python -m pip install --upgrade pip
          mkdir -p indexed
          download_exact() {
            local requirement="$1"
            local destination="$2"
            for attempt in 1 2 3 4 5; do
              if python -m pip download \
                --disable-pip-version-check \
                --no-cache-dir \
                --no-deps \
                --only-binary=:all: \
                --index-url "$INDEX_URL" \
                --dest "$destination" \
                "$requirement"; then
                return
              fi
              sleep 15
            done
            return 1
          }
          download_exact "vane-ai==$VANE_VERSION" indexed
          download_exact "vane-extension-avro==$AVRO_VERSION" indexed
          download_exact "vane-extension-iceberg==$ICEBERG_VERSION" indexed

          mapfile -t base_wheels < <(find indexed -maxdepth 1 -type f -name 'vane_ai-*.whl' -print)
          mapfile -t avro_wheels < <(find indexed -maxdepth 1 -type f -name 'vane_extension_avro-*.whl' -print)
          mapfile -t iceberg_wheels < <(find indexed -maxdepth 1 -type f -name 'vane_extension_iceberg-*.whl' -print)
          mapfile -t expected_avro < <(find expected/avro -maxdepth 1 -type f -name '*-cp312-none-manylinux_2_28_x86_64.whl' -print)
          mapfile -t expected_iceberg < <(find expected/iceberg -maxdepth 1 -type f -name '*-cp312-none-manylinux_2_28_x86_64.whl' -print)
          test "${#base_wheels[@]}" -eq 1
          test "${#avro_wheels[@]}" -eq 1
          test "${#iceberg_wheels[@]}" -eq 1
          test "${#expected_avro[@]}" -eq 1
          test "${#expected_iceberg[@]}" -eq 1
          cmp "${expected_avro[0]}" "${avro_wheels[0]}"
          cmp "${expected_iceberg[0]}" "${iceberg_wheels[0]}"
          python -m pip install "${base_wheels[0]}" "${avro_wheels[0]}" "${iceberg_wheels[0]}"
          python -m pip check

      - name: Start local Iceberg fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/generated/iceberg/spark-rest data/generated/intermediates
          docker compose -f scripts/docker-compose.yml down -v
          docker compose -f scripts/docker-compose.yml up -d

      - name: Wait for fixture initialization
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if docker compose -f scripts/docker-compose.yml logs mc 2>&1 | grep -Fq \
              'MinIO warehouse and default namespace initialized.'; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f scripts/docker-compose.yml logs
          exit 1

      - name: Exercise the indexed providers locally
        run: .venv-vane-testpypi-local/bin/python -I test/vane/test_vane_wheel_iceberg.py

      - name: Stop local Iceberg fixture
        if: always()
        run: docker compose -f scripts/docker-compose.yml down -v

