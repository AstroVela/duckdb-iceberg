# Run this release gate with Python 3.11+, independently of wheel interpreters.
interpreters = ["cp310", "cp311", "cp312", "cp313", "cp314"]
platforms = ["manylinux_2_28_x86_64"]
# TestPyPI upload budget, independent of Vane's native artifact safety limits.
max_wheel_bytes = 100000000

[providers.avro]
release_number = 1
distribution = "vane-extension-avro"
dependencies = []

[providers.iceberg]
release_number = 1
distribution = "vane-extension-iceberg"
dependencies = ["avro"]

# Packaging tools are pinned independently of the exact Vane runtime.
[packaging]
repository = "AstroVela/vane"
revision = "9fca0027e7c1f4610650d04a70884848a3e084b3"
